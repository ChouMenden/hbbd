<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Capricornus Constellation - Double Music</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #continueBtn {
            position: absolute;
            z-index: 100;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            display: none;
            cursor: pointer;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: white;
            box-shadow: 0 5px 15px rgba(34, 197, 94, 0.4);
            transition: all 0.3s ease;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
        }

        #continueBtn:hover { transform: translateX(-50%) scale(1.05); }

        @media (min-width: 768px) {
            #continueBtn {
                bottom: auto;
                top: 20px;
                right: 20px;
                left: auto;
                transform: none;
            }
        }
    </style>
</head>
<body>

    <audio id="bgMusic1" loop>
        <source src="snapvideo--Funny Viral Music for TikToks, Reels, and Shorts _ Nintendo Wii Mii Theme 😂🎮 The iconic Nintendo Wii Mii Channel Theme is back and going viral for all the right reasons. This quirky, nostalgic tune is the perfect funny soundtrack for .mp3" type="audio/mpeg">
    </audio>

    <audio id="bgMusic2" loop>
        <source src="nhac2.mp3" type="audio/mpeg">
    </audio>

    <canvas id="galaxy"></canvas>
    <button id="continueBtn">Tiếp tục hành trình</button>

    <script>
        const canvas = document.getElementById("galaxy");
        const ctx = canvas.getContext("2d");
        const btn = document.getElementById("continueBtn");
        
                const music1 = document.getElementById("bgMusic1");
        const music2 = document.getElementById("bgMusic2");

        let width, height, stars = [], asteroids = [], constellationStars = [];
        let spaceship = { x: 0, y: 0, state: "orbit", hoverAngle: 0 };
        let currentIdx = 0;
        let showConstellation = false, showMessage = false, msgAlpha = 0, constelAlpha = 0;
        let music2Started = false; // Biến kiểm soát để nhạc 2 chỉ chạy 1 lần khi bắt đầu
        
        const spaceshipImg = new Image();
        spaceshipImg.src = "https://cdn-icons-png.flaticon.com/512/2026/2026462.png"; 

        const asteroidConfig = [
            { px: 0.15, py: 0.2, pr: 0.07, color: "#f87171" },
            { px: 0.85, py: 0.15, pr: 0.08, color: "#60a5fa" },
            { px: 0.2, py: 0.8, pr: 0.075, color: "#34d399" },
            { px: 0.8, py: 0.85, pr: 0.07, color: "#fbbf24" }
        ];

        const capricornConfig = [
            { id: 0, px: 0.15, py: 0.25, r: 6 }, 
            { id: 1, px: 0.22, py: 0.30, r: 4 }, 
            { id: 2, px: 0.35, py: 0.33, r: 4 }, 
            { id: 3, px: 0.48, py: 0.35, r: 4 }, 
            { id: 4, px: 0.78, py: 0.28, r: 5 }, 
            { id: 5, px: 0.83, py: 0.15, r: 7 }, 
            { id: 6, px: 0.65, py: 0.75, r: 4 }, 
            { id: 7, px: 0.55, py: 0.85, r: 6 }, 
            { id: 8, px: 0.30, py: 0.58, r: 4 }  
        ];

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            stars = Array.from({ length: 400 }, () => ({
                x: Math.random() * width,
                y: Math.random() * height,
                r: Math.random() * 1.5,
                alpha: Math.random(),
                speed: 0.005 + Math.random() * 0.01
            }));
            const minSide = Math.min(width, height);
            asteroids = asteroidConfig.map(conf => ({
                x: conf.px * width,
                y: conf.py * height,
                r: conf.pr * minSide,
                color: conf.color
            }));
            constellationStars = capricornConfig.map(p => ({
                x: p.px * width,
                y: p.py * height,
                r: p.r
            }));
        }

        function drawGalaxy() {
            const grad = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width);
            grad.addColorStop(0, "#0a1128");
            grad.addColorStop(1, "#000");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
        }

        function drawConstellation() {
            if (!showConstellation) return;
            if (constelAlpha < 1) constelAlpha += 0.01;
            ctx.save();
            ctx.globalAlpha = constelAlpha;
            ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
            ctx.lineWidth = 2.5;
            ctx.shadowBlur = 15;
            ctx.shadowColor = "white";
            const s = constellationStars;
            ctx.beginPath();
            ctx.moveTo(s[0].x, s[0].y);
            ctx.lineTo(s[1].x, s[1].y);
            ctx.lineTo(s[2].x, s[2].y);
            ctx.lineTo(s[3].x, s[3].y);
            ctx.lineTo(s[4].x, s[4].y);
            ctx.lineTo(s[5].x, s[5].y);
            ctx.moveTo(s[4].x, s[4].y);
            ctx.lineTo(s[6].x, s[6].y);
            ctx.lineTo(s[7].x, s[7].y);
            ctx.lineTo(s[8].x, s[8].y);
            ctx.lineTo(s[0].x, s[0].y);
            ctx.stroke();
            s.forEach((star, index) => {
                ctx.fillStyle = "white";
                ctx.shadowBlur = (index === 0 || index === 5 || index === 7) ? 25 : 10;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();
        }

        function updateSpaceship() {
            let target = currentIdx < asteroids.length ? asteroids[currentIdx] : { x: width/2, y: height/2 };
            
            if (spaceship.state === "orbit" || spaceship.state === "moving") {
                spaceship.x += (target.x - spaceship.x) * 0.05;
                spaceship.y += (target.y - spaceship.y) * 0.05;
                
                if (Math.abs(spaceship.x - target.x) < 1 && Math.abs(spaceship.y - target.y) < 1) {
                    if (currentIdx < asteroids.length) {
                        spaceship.state = "landed";
                        btn.style.display = "block";
                    } else {
                        spaceship.state = "final";
                        showConstellation = true;
                                                
                        if (!music2Started) {
                            music1.pause(); // Dừng nhạc 1
                            music2.currentTime = 0; // Reset nhạc 2 về đầu
                            music2.play().catch(e => console.log(e)); // Phát nhạc 2
                            music2Started = true;
                        }
                        
                        setTimeout(() => showMessage = true, 800);
                    }
                }
            } else if (spaceship.state === "final") {
                spaceship.hoverAngle += 0.05;
                spaceship.y = height/2 + Math.sin(spaceship.hoverAngle) * 10;
            }
            if (spaceshipImg.complete) {
                const s = width < 600 ? 50 : 70;
                ctx.drawImage(spaceshipImg, spaceship.x - s/2, spaceship.y - s/2, s, s);
            }
        }

        function drawMessage() {
            if (!showMessage) return;
            if (msgAlpha < 1) msgAlpha += 0.02;
            ctx.save();
            ctx.globalAlpha = msgAlpha;
            const boxW = Math.min(width * 0.85, 380);
            const boxX = (width - boxW) / 2;
            const boxY = 80;
            ctx.fillStyle = "rgba(0,0,0,0.85)";
            ctx.strokeStyle = "#4ade80";
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.roundRect(boxX, boxY, boxW, 130, 20); ctx.fill(); ctx.stroke();
            ctx.fillStyle = "#4ade80";
            ctx.textAlign = "center";
            ctx.font = "bold 20px Arial";
            ctx.fillText("✦ NGUYỄN NGỌC THẢO NGUYÊN ✦", width/2, boxY + 50);
            ctx.fillStyle = "white";
            ctx.font = "18px Arial";
            ctx.fillText("CHÚC MỪNG SINH NHẬT IEMMMMMMMM", width/2, boxY + 90);
            ctx.restore();
        }

        function loop() {
            ctx.clearRect(0, 0, width, height);
            drawGalaxy();
            stars.forEach(s => {
                s.alpha += s.speed;
                if (s.alpha > 1 || s.alpha < 0) s.speed *= -1;
                ctx.globalAlpha = Math.abs(s.alpha);
                ctx.fillStyle = "white";
                ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1;
            asteroids.forEach(a => {
                let g = ctx.createRadialGradient(a.x, a.y, a.r*0.5, a.x, a.y, a.r*1.8);
                g.addColorStop(0, a.color + "44");
                g.addColorStop(1, "transparent");
                ctx.fillStyle = g;
                ctx.beginPath(); ctx.arc(a.x, a.y, a.r*1.8, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = a.color;
                ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, Math.PI*2); ctx.fill();
            });
            drawConstellation();
            updateSpaceship();
            drawMessage();
            requestAnimationFrame(loop);
        }

        window.addEventListener("resize", init);
        
        btn.addEventListener("click", () => {
            // Khi nhấn nút đầu tiên, phát nhạc 1
            if (currentIdx === 0 && music1.paused) {
                music1.play().catch(e => console.log(e));
            }

            btn.style.display = "none";
            currentIdx++;
            spaceship.state = "moving";
        });

        init();
        loop();
    </script>
</body>
</html>
